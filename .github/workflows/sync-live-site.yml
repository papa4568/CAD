name: Sync live CAD-PAD site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-live-site.yml
      - tools/mirror-site.sh

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mirror live CAD-PAD site
        run: bash tools/mirror-site.sh

      - name: Commit refreshed snapshot
        shell: bash
        run: |
          git add site
          if git diff --cached --quiet -- site; then
            echo "Live snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mirror live CAD-PAD site"
          git push
